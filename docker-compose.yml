# Pull and run:   docker compose up -d      → http://localhost:8080
# Works with zero configuration. For anything beyond a trial, copy .env.example to .env
# and set JWT_SECRET and POSTGRES_PASSWORD.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: realtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realtime}
      POSTGRES_DB: realtime
    volumes:
      - realtime_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U realtime -d realtime']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: matthew552/realtime:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://realtime:${POSTGRES_PASSWORD:-realtime}@db:5432/realtime
      # Leave empty for a random secret per start (everyone is signed out on restart).
      JWT_SECRET: ${JWT_SECRET:-}
      # Set to "true" when you serve the app over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${APP_PORT:-8080}:8080'

volumes:
  realtime_db:
