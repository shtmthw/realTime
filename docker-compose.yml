services:
  db:
    image: mysql:8.0
    container_name: realtime-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: realtime_chat
    ports:
      - "3306:3306"
    volumes:
      - realtime_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  api:
    build: ./project
    image: matthew552/realtime-api
    container_name: realtime-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:rootpassword@db:3306/realtime_chat
      JWT_SECRET: dev-secret-change-me-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    build:
      context: ./client/Client-GraphQL-Chat
      args:
        VITE_API_URL: /graphql
    image: matthew552/realtime-client
    container_name: realtime-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  realtime_db_data:
